<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <!-- Deep Navy Executive Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#142c5c"/>
      <stop offset="50%" stop-color="#0a1f44"/>
      <stop offset="100%" stop-color="#040b17"/>
    </radialGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b301" stop-opacity="0"/>
      <stop offset="25%" stop-color="#f5b301"/>
      <stop offset="75%" stop-color="#f5b301"/>
      <stop offset="100%" stop-color="#f5b301" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Tech Matrix Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#centerGlow)"/>
  <rect width="1200" height="220" fill="url(#grid)"/>

  <!-- Top & Bottom Gold Accent Lines -->
  <rect y="0" width="1200" height="2" fill="url(#goldLine)"/>
  <rect y="218" width="1200" height="2" fill="url(#goldLine)"/>

  <!-- Subtle Ambient Corner Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="100" y2="0"/>
    <line x1="1100" y1="220" x2="1200" y2="170"/>
  </g>

  <!-- Centered Typographic Master Composition -->
  <g transform="translate(600, 0)">
    <!-- Main Society Name: Grand, Authoritative, Executive -->
    <text x="0" y="102" text-anchor="middle" font-family="'Oswald', 'DIN Alternate', 'Arial Narrow', 'Helvetica Neue', sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      UOSAHIWAL ENTREPRENEURSHIP SOCIETY
    </text>

    <!-- Gold Accent Divider Bar -->
    <rect x="-65" y="122" width="130" height="2.5" fill="#f5b301" rx="1.25"/>

    <!-- Tagline Subtitle -->
    <text x="0" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" letter-spacing="3.5">
      EMPOWERING STUDENT FOUNDERS &#8226; INNOVATORS &#8226; BUILDERS
    </text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Deep Obsidian to Midnight Navy Gradient -->
    <radialGradient id="typoLuxGlow" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#142c5c"/>
      <stop offset="38%" stop-color="#0a1f44"/>
      <stop offset="72%" stop-color="#051024"/>
      <stop offset="100%" stop-color="#020712"/>
    </radialGradient>

    <!-- Warm Golden Ambient Center Diffusion -->
    <radialGradient id="typoGoldHalo" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f5b301" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#f5b301" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f5b301" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Foil Linear Accent -->
    <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#f5b301"/>
      <stop offset="100%" stop-color="#c98a00"/>
    </linearGradient>

    <!-- Hairline Edge Borders -->
    <linearGradient id="edgeHairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b301" stop-opacity="0"/>
      <stop offset="25%" stop-color="#f5b301" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#f5b301" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f5b301" stop-opacity="0"/>
    </linearGradient>

    <!-- Divider Taper Gradient -->
    <linearGradient id="dividerTaper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b301" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5b301" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5b301" stop-opacity="0"/>
    </linearGradient>

    <!-- Technical Matrix Grid -->
    <pattern id="luxGridTypo" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03"/>
      <circle cx="48" cy="48" r="0.75" fill="#f5b301" fill-opacity="0.22"/>
    </pattern>

    <!-- Text Soft Glow / Shadow -->
    <filter id="textDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#typoLuxGlow)"/>
  <rect width="1200" height="380" fill="url(#typoGoldHalo)"/>
  <rect width="1200" height="380" fill="url(#luxGridTypo)"/>

  <!-- Top & Bottom Gold Hairline Sheen -->
  <rect y="0" width="1200" height="2" fill="url(#edgeHairline)"/>
  <rect y="378" width="1200" height="2" fill="url(#edgeHairline)"/>

  <!-- Atmospheric Architectural Geometry -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="1040" y1="0" x2="1040" y2="380"/>
    <circle cx="600" cy="190" r="170" fill="none" stroke="#f5b301" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="600" cy="190" r="185" fill="none" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- Centered Typographic Masterwork -->
  <g transform="translate(600, 0)" filter="url(#textDepth)">
    <!-- Main Monumental Title -->
    <text x="0" y="172" text-anchor="middle" font-family="'Oswald', 'DIN Alternate', 'Arial Narrow', 'Helvetica Neue', sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="2.5">
      UOSAHIWAL ENTREPRENEURSHIP SOCIETY
    </text>

    <!-- Luxury Gold Accent Divider with Diamond -->
    <g transform="translate(0, 206)">
      <line x1="-140" y1="0" x2="140" y2="0" stroke="url(#dividerTaper)" stroke-width="2"/>
      <polygon points="0,-5 5,0 0,5 -5,0" fill="#ffe082"/>
    </g>

    <!-- Tagline Subtitle -->
    <text x="0" y="244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f5b301" letter-spacing="4">
      EMPOWERING STUDENT FOUNDERS &#8226; INNOVATORS &#8226; BUILDERS
    </text>
  </g>
</svg>

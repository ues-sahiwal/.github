<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 90" width="960" height="90" role="img" aria-label="Where campus ideas leave the notebook and ship." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <mask id="reveal">
      <rect x="0" y="0" width="0" height="90" fill="#fff">
        <animate attributeName="width" values="0;760;760" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#E09F3E"/>
      <stop offset="1" stop-color="#2F8F83"/>
    </linearGradient>
  </defs>
  <text x="100" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="url(#ink)" mask="url(#reveal)">Where campus ideas leave the notebook and ship.</text>
  <rect x="100" y="28" width="3" height="34" fill="#E09F3E">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

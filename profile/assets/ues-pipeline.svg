<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Build loop: idea, validate, branch, review, ship, learn" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="4" y="4" width="992" height="212" rx="18" fill="#F7F4EE" stroke="#E4DCCB" stroke-width="2"/>
  <path d="M110 110 H890" stroke="#D6CCB8" stroke-width="4" fill="none"/>
  <path d="M110 110 H890" stroke="#E09F3E" stroke-width="4" fill="none" stroke-linecap="round"
        stroke-dasharray="6 26">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2A3A" text-anchor="middle">
    <text x="110" y="168">idea</text>
    <text x="278" y="168">validate</text>
    <text x="446" y="168">branch</text>
    <text x="614" y="168">review</text>
    <text x="782" y="168">ship</text>
    <text x="890" y="168">learn</text>
  </g>
  <g fill="#E09F3E">
    <circle cx="110" cy="110" r="12"><animate attributeName="r" values="12;17;12" dur="1.8s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="278" cy="110" r="12"><animate attributeName="r" values="12;17;12" dur="1.8s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="446" cy="110" r="12"><animate attributeName="r" values="12;17;12" dur="1.8s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="614" cy="110" r="12"><animate attributeName="r" values="12;17;12" dur="1.8s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="782" cy="110" r="12"><animate attributeName="r" values="12;17;12" dur="1.8s" repeatCount="indefinite" begin="1.2s"/></circle>
  </g>
  <circle cx="890" cy="110" r="12" fill="#2F8F83">
    <animate attributeName="r" values="12;17;12" dur="1.8s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

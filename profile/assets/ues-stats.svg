<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Four pillars, four initiatives, four disciplines, one shared mission" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .num { font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: 700; fill: #E09F3E; }
      .lbl { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #1F2A3A; }
      .card { fill: #F7F4EE; stroke: #E4DCCB; stroke-width: 2; }
    </style>
  </defs>
  <g>
    <rect class="card" x="20" y="20" width="220" height="110" rx="16"/>
    <text class="num" x="130" y="88" text-anchor="middle" opacity="0">4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.2;1" dur="8s" repeatCount="indefinite"/></text>
    <text class="lbl" x="130" y="116" text-anchor="middle">core pillars</text>
  </g>
  <g>
    <rect class="card" x="260" y="20" width="220" height="110" rx="16"/>
    <text class="num" x="370" y="88" text-anchor="middle" opacity="0">4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.24;1" dur="8s" repeatCount="indefinite"/></text>
    <text class="lbl" x="370" y="116" text-anchor="middle">campus initiatives</text>
  </g>
  <g>
    <rect class="card" x="500" y="20" width="220" height="110" rx="16"/>
    <text class="num" x="610" y="88" text-anchor="middle" opacity="0">4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.28;1" dur="8s" repeatCount="indefinite"/></text>
    <text class="lbl" x="610" y="116" text-anchor="middle">academic disciplines</text>
  </g>
  <g>
    <rect class="card" x="740" y="20" width="240" height="110" rx="16"/>
    <text class="num" x="860" y="88" text-anchor="middle" opacity="0">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.32;1" dur="8s" repeatCount="indefinite"/></text>
    <text class="lbl" x="860" y="116" text-anchor="middle">shared mission</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

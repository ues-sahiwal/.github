<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Four steps to join: reach out, attend a bootcamp, open your first issue, pick a project" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .step { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1F2A3A; }
      .sub  { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #1F2A3A; }
    </style>
  </defs>
  <path id="route" d="M110 90 C 260 40, 340 140, 490 90 S 720 40, 890 90" stroke="#D6CCB8" stroke-width="4" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle r="11" fill="#E09F3E">
    <animateMotion dur="5s" repeatCount="indefinite" path="M110 90 C 260 40, 340 140, 490 90 S 720 40, 890 90"/>
  </circle>
  <g>
    <circle cx="110" cy="90" r="22" fill="#F7F4EE" stroke="#E09F3E" stroke-width="3"/>
    <text x="110" y="97" text-anchor="middle" class="step">1</text>
    <text x="110" y="150" text-anchor="middle" class="step">Reach out</text>
    <text x="110" y="172" text-anchor="middle" class="sub">Contact leadership</text>
  </g>
  <g>
    <circle cx="363" cy="112" r="22" fill="#F7F4EE" stroke="#2F8F83" stroke-width="3"/>
    <text x="363" y="119" text-anchor="middle" class="step">2</text>
    <text x="363" y="164" text-anchor="middle" class="step">Attend a bootcamp</text>
    <text x="363" y="186" text-anchor="middle" class="sub">Start with Git Ground Zero</text>
  </g>
  <g>
    <circle cx="617" cy="68" r="22" fill="#F7F4EE" stroke="#E09F3E" stroke-width="3"/>
    <text x="617" y="75" text-anchor="middle" class="step">3</text>
    <text x="617" y="120" text-anchor="middle" class="step">Open an issue</text>
    <text x="617" y="142" text-anchor="middle" class="sub">First Contribution Sandbox</text>
  </g>
  <g>
    <circle cx="890" cy="90" r="22" fill="#2F8F83"/>
    <text x="890" y="97" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#F7F4EE">4</text>
    <text x="890" y="150" text-anchor="middle" class="step">Pick a project</text>
    <text x="890" y="172" text-anchor="middle" class="sub">Join a venture or start one</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

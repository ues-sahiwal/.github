<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Four disciplines orbiting UES: Computing, Business, Economics, Humanities" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .sat text { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1F2A3A; }
      .core { font-family: Georgia, 'Times New Roman', serif; font-size: 40px; font-weight: 700; fill: #F7F4EE; }
    </style>
  </defs>
  <circle cx="500" cy="210" r="150" fill="none" stroke="#D6CCB8" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="500" cy="210" r="78" fill="#1F2A3A"/>
  <text class="core" x="500" y="222" text-anchor="middle">UES</text>

  <g class="sat">
    <g>
      <animateMotion dur="16s" repeatCount="indefinite" path="M500 60 A150 150 0 1 1 500 360 A150 150 0 1 1 500 60"/>
      <circle cx="0" cy="0" r="58" fill="#E09F3E"/>
      <text x="0" y="5" text-anchor="middle">Computing</text>
    </g>
  </g>
  <g class="sat">
    <g>
      <animateMotion dur="16s" begin="-4s" repeatCount="indefinite" path="M500 60 A150 150 0 1 1 500 360 A150 150 0 1 1 500 60"/>
      <circle cx="0" cy="0" r="58" fill="#2F8F83"/>
      <text x="0" y="5" text-anchor="middle" style="fill:#F7F4EE">Business</text>
    </g>
  </g>
  <g class="sat">
    <g>
      <animateMotion dur="16s" begin="-8s" repeatCount="indefinite" path="M500 60 A150 150 0 1 1 500 360 A150 150 0 1 1 500 60"/>
      <circle cx="0" cy="0" r="58" fill="#F7F4EE" stroke="#E09F3E" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle">Economics</text>
    </g>
  </g>
  <g class="sat">
    <g>
      <animateMotion dur="16s" begin="-12s" repeatCount="indefinite" path="M500 60 A150 150 0 1 1 500 360 A150 150 0 1 1 500 60"/>
      <circle cx="0" cy="0" r="58" fill="#2F8F83" fill-opacity="0.25" stroke="#2F8F83" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle">Humanities</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

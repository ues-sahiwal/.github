<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120" role="img" aria-label="Core pillars" xmlns:c2pa="http://c2pa.org/manifest">
  <text x="0" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1F2A3A">Core pillars
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
  </text>
  <rect x="0" y="92" width="520" height="8" rx="4" fill="#2F8F83">
    <animate attributeName="width" from="0" to="520" dur="0.9s" begin="0.3s" fill="freeze"/>
  </rect>
  <rect x="0" y="92" width="520" height="8" rx="4" fill="#E09F3E" opacity="0.4">
    <animate attributeName="width" from="0" to="520" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
